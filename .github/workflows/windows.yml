name: Build and test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows with TeX Live and Chromium
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
      CTAN_REPO: https://mirror.ctan.org/systems/texlive/tlnet
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.mod

      - name: Set up Node.js for the build
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run editor unit tests
        run: npm run test:unit

      - name: Build the frontend
        run: npm run build

      - name: Embed the Windows application icon
        run: npm run build:windows-resources

      - name: Run Go tests
        run: go test ./...

      - name: Build the Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$version" -o bin/local-tex-editor.exe ./cmd/local-tex-editor
          if ($LASTEXITCODE -ne 0) { throw 'The Windows build failed.' }
          "LOCAL_TEX_EDITOR_TEST_EXE=$((Resolve-Path bin/local-tex-editor.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check the version of the Windows application
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $application = (Resolve-Path 'bin/local-tex-editor.exe').Path
          $process = Start-Process -FilePath $application -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput 'application-version.txt' -RedirectStandardError 'application-version-error.txt'
          if ($process.ExitCode -ne 0) { throw 'The application could not report its version.' }
          $actualVersion = (Get-Content 'application-version.txt' -Raw).Trim()
          if ($actualVersion -ne $expectedVersion) { throw "The application reports $actualVersion, but the release is $expectedVersion." }
          "Verified application version: $actualVersion"

      - name: Check the icons in the Windows application
        shell: pwsh
        run: |
          $env:LOCAL_TEX_EDITOR_ICON_EXE = (Resolve-Path 'bin/local-tex-editor.exe').Path
          go test ./cmd/local-tex-editor -run '^TestWindowsExecutableIcon$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'The Windows icon check failed.' }

      - name: Set up TeX Live for tests
        uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - name: Install Japanese TeX packages
        shell: pwsh
        run: |
          tlmgr update --self
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the TeX Live package manager.' }
          tlmgr install latexmk uptex uptex-base uplatex platex jsclasses dvipdfmx synctex natbib ptex-fonts ptex-fontmaps haranoaji adobemapping
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the TeX packages needed for the tests.' }
          fmtutil-sys --byfmt uplatex
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the upLaTeX format.' }
          updmap-sys --setoption kanjiEmbed haranoaji
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure the Japanese fonts.' }
          kpsewhich --format=cmap UniJIS2004-UTF16-H
          if ($LASTEXITCODE -ne 0) { throw 'Could not find the CMap needed for Japanese PDF output.' }
          kpsewhich HaranoAjiMincho-Regular.otf
          if ($LASTEXITCODE -ne 0) { throw 'Could not find the Japanese font needed for PDF output.' }
          $texBin = Split-Path -Parent (Get-Command uplatex.exe).Source
          "LOCAL_TEX_EDITOR_TEST_TEX_BIN=$texBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $texBin 'latexmk.exe') -v
          if ($LASTEXITCODE -ne 0) { throw 'latexmk could not start.' }
          & (Join-Path $texBin 'upbibtex.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'upBibTeX could not start.' }
          & (Join-Path $texBin 'synctex.exe') help
          if ($LASTEXITCODE -ne 0) { throw 'SyncTeX could not start.' }

      - name: Install Chromium for browser tests
        run: npx playwright install chromium

      - name: Download the previous release for the update test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force test-previous | Out-Null
          gh release download v0.1.2 --repo "$env:GITHUB_REPOSITORY" --pattern 'local-tex-editor-0.1.2-windows-x64.zip' --dir test-previous
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous application for the update test.' }
          $archive = 'test-previous/local-tex-editor-0.1.2-windows-x64.zip'
          $expectedHash = 'f187c257880905d9c6592334f9fcc18302eef6c89bc2c7b5b4e7740c075430d1'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) { throw 'The previous release archive did not match its recorded SHA-256.' }
          Expand-Archive -LiteralPath $archive -DestinationPath test-previous/application
          "LOCAL_TEX_EDITOR_TEST_PREVIOUS_EXE=$((Resolve-Path test-previous/application/local-tex-editor.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'LOCAL_TEX_EDITOR_TEST_PREVIOUS_VERSION=0.1.2' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test editing and compilation in the browser
        run: npm test

      - name: Test the Windows folder selection dialog
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          LOCAL_TEX_EDITOR_TEST_NATIVE_PICKER: '1'
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          go test -p 1 -count=1 -timeout 90s -v -run NativeFolderPicker ./internal/platform ./internal/app 2>&1 | Tee-Object -FilePath native-folder-picker.log
          $testExitCode = $LASTEXITCODE
          Copy-Item native-folder-picker.log test-results/native-folder-picker.log
          if ($testExitCode -ne 0) { throw 'The Windows folder selection test failed.' }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare the download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item bin/local-tex-editor.exe, README.md, LICENSE -Destination dist/windows
          New-Item -ItemType Directory -Force dist/windows/docs/screenshots | Out-Null
          Copy-Item docs/screenshots/editor-dark.png -Destination dist/windows/docs/screenshots
          Get-FileHash dist/windows/local-tex-editor.exe -Algorithm SHA256 | Format-List
          $size = (Get-Item dist/windows/local-tex-editor.exe).Length
          "Windows application: $size bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload the tested Windows application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-tex-editor-windows-x64
          path: dist/windows/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the tested application
    needs: windows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create a release when the version is new
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" --name local-tex-editor-windows-x64 --dir release-package
          archive="local-tex-editor-$version-windows-x64.zip"
          (cd release-package && zip -r "../$archive" .)
          sha256sum "$archive" > SHA256SUMS.txt
          gh release create "$tag" "$archive" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Local TeX Editor $version" \
            --notes-file "release-notes/$tag.md"
